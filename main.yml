name: BabaNews Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ✅ UPDATE ICI

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: node scripts/bot.js

      - name: Commit & Push
        run: |
          git config --global user.name "babanews-bot"
          git config --global user.email "bot@babanews.com"
          git add .
          git commit -m "Auto news update" || echo "No changes"
          git push
