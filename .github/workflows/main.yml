name: BabaNews Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: node scripts/bot.js

      - name: Commit changes
        run: |
          git config --global user.name "babanews-bot"
          git config --global user.email "bot@babanews.com"
          git add .
          git commit -m "Auto news update" || echo "No changes"
          git push
